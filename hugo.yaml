baseURL: "https://nirajkashyap.github.io/"
title: Niraj Kashyap
languageCode: en-us
pagination.pagerSize: 5
theme: hugo-book


publishDir: docs

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# Book configuration
disablePathToLower: true
enableGitInfo: true


# Needed for mermaid/katex shortcodes
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
  highlight:
    style: base16-snazzy


# Multi-lingual mode config
# There are different options to translate files
# See https://gohugo.io/content-management/multilingual/#translation-by-filename
# And https://gohugo.io/content-management/multilingual/#translation-by-content-directory
languages:
  en:
    label: English
    contentDir: content
    weight: 1
  # zh:
  #   label: Chinese
  #   contentDir: content.zh
  #   weight: 2
  # he:
  #   label: Hebrew
  #   contentDir: content.he
  #   direction: rtl
  #   weight: 3


minify:
  disableXML: true
  minifyOutput: false
  # disableCSS: false
  # # tdewolff:
  # #   css:
  # #     # inline: true
  # #     precision: 1
  # #     # version: 0

# services:
#   googleAnalytics:
