  BookEditLink: "https://github.com/Nirajkashyap/nirajkashyap.github.io/edit/main/{{ .Path }}"

  analytics:
    google:
      SiteVerificationTag: "eKy67xvjTMrmuEu-KizFoWNyijXJvY8rNRcYsxZaMtA"
